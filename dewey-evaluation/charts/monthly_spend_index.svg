<title id="title">Monthly card spend indexed to the corresponding 2025 month</title>
<desc id="desc">2026 matched spend / 2025 matched spend; same calendar days across all brands and both years. n=8 monthly comparisons per brand; n=2 periods per comparison, descriptive only. Matched days, Jan to Aug: 25, 22, 20, 22, 25, 20, 25, 6. Coverage counts are not independent observations. August uses Aug 1-7 only; all months partial. Missing days are not zero-filled or annualized. This is a same-month baseline, not the upstream Norwegian/peer-dollar index.</desc>
